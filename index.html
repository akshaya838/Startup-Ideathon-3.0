<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Startup Ideathon 3.0 — Coimbatore Institute of Technology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700;900&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&family=Almendra:ital,wght@0,400;0,700;1,400;1,700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --obsidian:#07080a;
    --charcoal:#13161a;
    --charcoal-2:#1b1f24;
    --parchment:#e9ddc0;
    --parchment-dim:#a89a76;
    --gold:#c9a227;
    --gold-bright:#e6c04d;
    --ember:#b33a1e;
    --ember-bright:#e05a32;
    --frost:#6e8ca0;
    --frost-bright:#9dc0d6;
    --line: rgba(201,162,39,0.22);
    --disp: 'Cinzel', serif;
    --disp2: 'Cinzel Decorative', serif;
    --body: 'Spectral', serif;
    --mono: 'JetBrains Mono', monospace;
    --decree: 'IM Fell English', 'Almendra', serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--obsidian);
    color:var(--parchment);
    font-family:var(--body);
    font-weight:400;
    line-height:1.65;
    overflow-x:hidden;
  }
  ::selection{background:var(--gold); color:var(--obsidian);}
  a{color:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;}
  h1,h2,h3,h4{font-family:var(--disp); font-weight:700; margin:0; letter-spacing:0.02em;}
  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--gold);
  }
  .rule{
    width:64px; height:1px; background:linear-gradient(90deg,var(--gold),transparent);
    margin:18px 0;
  }
  .rule.center{margin:18px auto;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  /* ---------- NAV ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px;
    background:rgba(7,8,10,0);
    border-bottom:1px solid transparent;
    transition:background .35s ease, border-color .35s ease, padding .35s ease;
  }
  header.scrolled{
    background:rgba(7,8,10,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:12px 32px;
  }
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--disp); font-size:16px; letter-spacing:0.08em; color:var(--parchment);}
  .brand svg{width:26px;height:26px;flex-shrink:0;}
  nav ul{list-style:none; display:flex; gap:34px; margin:0; padding:0;}
  nav a{
    font-family:var(--mono); font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
    text-decoration:none; color:var(--parchment-dim); position:relative; padding-bottom:4px;
    transition:color .25s ease;
  }
  nav a::after{
    content:""; position:absolute; left:0; bottom:0; width:0; height:1px; background:var(--gold);
    transition:width .3s ease;
  }
  nav a:hover{color:var(--parchment);}
  nav a:hover::after{width:100%;}
  .nav-cta{
    font-family:var(--mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    border:1px solid var(--gold); color:var(--gold); padding:9px 18px; text-decoration:none;
    transition:background .25s ease,color .25s ease;
  }
  .nav-cta:hover{background:var(--gold); color:var(--obsidian);}
  .menu-btn{display:none; background:none; border:1px solid var(--line); color:var(--parchment); width:38px;height:38px; align-items:center; justify-content:center; cursor:pointer;}
  .mobile-menu{
    display:none; position:fixed; inset:0; background:var(--obsidian); z-index:99;
    flex-direction:column; align-items:center; justify-content:center; gap:28px;
  }
  .mobile-menu.open{display:flex;}
  .mobile-menu a{font-family:var(--disp); font-size:20px; color:var(--parchment); text-decoration:none;}
  .mobile-menu .nav-cta{margin-top:10px;}

  /* ---------- HERO ---------- */

      radial-gradient(ellipse at 50% 0%, rgba(179,58,30,0.14), transparent 55%),
